<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin — Biblioteca</title>
<style>
  :root {
    --bg: #f5f0e8;
    --bg2: #efe7d8;
    --card: #fffdf8;
    --ink: #3d3226;
    --ink-soft: #7a6a55;
    --accent: #8c5836;
    --accent-dark: #6e4327;
    --gold: #c9a34a;
    --line: #e2d6c2;
    --ok: #3e7d4f;
    --shadow: 0 6px 22px rgba(61, 43, 28, .14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: radial-gradient(1200px 500px at 50% -100px, #fbf7ef 0%, transparent 60%), var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(120deg, #241a10, #4a3420 55%, #241a10);
    color: #f3ead9;
    padding: 20px;
    text-align: center;
    border-bottom: 4px solid var(--gold);
  }
  h1 { font-size: 1.4rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 400; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }

  /* ---------- login ---------- */
  #login { max-width: 380px; margin: 48px auto 0; }
  .caja {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 28px 24px;
  }
  .caja h2 { text-align: center; font-weight: 400; letter-spacing: .06em; margin-bottom: 18px; }
  .caja input {
    width: 100%;
    font: 16px Georgia, serif;
    padding: 12px 14px;
    margin-bottom: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    outline: none;
  }
  .caja input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(140,88,54,.12); }
  button { font-family: Georgia, serif; cursor: pointer; }
  .btn {
    display: inline-block;
    font-size: 1rem;
    padding: 12px 18px;
    border: 0;
    border-radius: 24px;
    background: var(--accent);
    color: #fff;
    transition: background .15s ease;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { opacity: .55; cursor: wait; }
  .btn.full { width: 100%; }
  .btn.sec { background: var(--bg2); color: var(--ink); border: 1px solid var(--line); }
  .error { color: #a33; font-size: .88rem; text-align: center; min-height: 1.2em; margin-top: 8px; }
  .hint { color: var(--ink-soft); font-size: .88rem; margin-bottom: 16px; }
  .preview { margin-top: 16px; color: var(--ink-soft); font-size: .92rem; line-height: 1.8; }
  .preview b { color: var(--accent-dark); }

  /* ---------- app ---------- */
  #app { display: none; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 24px; overflow: hidden; background: #fff; }
  .tabs button {
    padding: 10px 18px; border: 0; background: transparent; color: var(--ink-soft); font-size: 15px;
  }
  .tabs button.active { background: var(--accent); color: #fff; }
  .logout { font-size: 14px; padding: 9px 16px; border: 1px solid var(--line); border-radius: 20px; background: #fff; color: var(--ink-soft); }
  .logout:hover { color: var(--ink); border-color: var(--accent); }

  .progreso {
    background: var(--bg2); border-radius: 20px; padding: 6px 14px;
    font-size: .85rem; color: var(--ink-soft); white-space: nowrap;
  }

  /* ---------- wizard ---------- */
  .wcard {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); padding: 20px; margin-bottom: 18px;
    display: flex; gap: 18px; align-items: flex-start;
    animation: entrar .3s ease;
  }
  @keyframes entrar { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .wcover {
    flex: 0 0 130px; aspect-ratio: 2/3; border-radius: 8px; overflow: hidden;
    background: var(--bg2) center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    text-align: center; font-style: italic; color: var(--ink-soft); font-size: .85rem; padding: 10px;
  }
  .wcover img { width: 100%; height: 100%; object-fit: cover; }
  .wmeta { flex: 1; min-width: 0; }
  .wmeta .titulo { font-size: 1.15rem; font-weight: 700; line-height: 1.3; }
  .wmeta .autor { font-style: italic; color: var(--ink-soft); margin-top: 4px; }
  .wmeta .genero {
    display: inline-block; margin-top: 10px; font-size: .72rem;
    background: var(--bg2); padding: 3px 10px; border-radius: 10px; color: var(--ink-soft);
  }
  .panel-precio {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); padding: 20px;
  }
  .panel-precio h3 { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); font-weight: 400; margin-bottom: 14px; text-align: center; }
  .grid-precios { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .grid-precios button {
    font-size: 1.15rem; font-weight: 700;
    padding: 16px 6px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--accent-dark);
    transition: background .12s ease, transform .08s ease;
  }
  .grid-precios button:hover { background: var(--bg2); }
  .grid-precios button:active { transform: scale(.96); background: var(--gold); color: #3a2c10; }
  .acciones {
    display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; align-items: center;
  }
  .acciones .btn, .acciones .btn.sec { padding: 11px 18px; border-radius: 22px; border: 0; font-size: .95rem; }
  .acciones input {
    font: 16px Georgia, serif; width: 110px; padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 22px; outline: none;
  }
  .fin {
    text-align: center; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); padding: 48px 20px;
  }
  .fin .grande { font-size: 2.6rem; }
  .fin p { color: var(--ink-soft); margin: 10px 0 18px; }

/* ---------- margen de ganancia ---------- */
let MARGEN = 0;
async function cargarMargen() {
  const { data } = await sb.from('config').select('valor').eq('clave', 'ganancia').maybeSingle();
  if (data) MARGEN = parseFloat(data.valor) || 0;
  $('cfgMargen').value = MARGEN;
  previewMargen();
}
const precioPublico = l => l.precio != null ? Math.round(l.precio * (1 + MARGEN / 100)) : null;
function previewMargen() {
  const m = parseFloat($('cfgMargen').value) || 0;
  $('cfgPreview').innerHTML = [200, 400, 1000].map(p =>
    `C$ ${p} → <b>C$ ${Math.round(p * (1 + m / 100))}</b>`).join(' &nbsp;·&nbsp; ');
}
$('cfgMargen').addEventListener('input', previewMargen);
$('btnMargen').onclick = async () => {
  const v = parseFloat($('cfgMargen').value);
  if (isNaN(v) || v < 0 || v > 500) { toast('Porcentaje inválido', true); return; }
  const { error } = await sb.from('config').upsert({ clave: 'ganancia', valor: String(v) });
  if (error) { toast('Error: ' + error.message, true); return; }
  MARGEN = v;
  toast(`✓ Ganancia ${v}% guardada — el sitio público se actualiza solo`);
  previewMargen();
  renderLista();
};

/* ---------- gestión ---------- */
  .buscar { width: 100%; font: 16px Georgia, serif; padding: 12px 16px; margin-bottom: 14px;
    border: 1px solid var(--line); border-radius: 24px; background: #fff; outline: none; }
  .buscar:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(140,88,54,.12); }
  .lista { display: flex; flex-direction: column; gap: 10px; }
  .fila {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 10px 14px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .mini {
    flex: 0 0 42px; width: 42px; height: 62px; border-radius: 4px; overflow: hidden;
    background: var(--bg2) center/cover no-repeat; display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); font-size: .9rem;
  }
  .mini img { width: 100%; height: 100%; object-fit: cover; }
  .info { flex: 1 1 200px; min-width: 0; }
  .info .t { font-weight: 700; font-size: .95rem; line-height: 1.3; }
  .info .a { font-size: .8rem; font-style: italic; color: var(--ink-soft); }
  .precio-tag { font-weight: 700; color: var(--accent-dark); white-space: nowrap; }
  .fila .acciones-f { display: flex; gap: 8px; }
  .mini-btn { font-size: .8rem; padding: 7px 12px; border: 1px solid var(--line); border-radius: 16px; background: #fff; color: var(--ink-soft); }
  .mini-btn:hover { border-color: var(--accent); color: var(--ink); }
  .sin { text-align: center; color: var(--ink-soft); font-style: italic; padding: 40px 0; }

  /* ---------- modal ---------- */
  .modal-fondo {
    position: fixed; inset: 0; background: rgba(36,26,16,.55);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .modal-fondo.abierto { display: flex; }
  .modal {
    background: var(--card); border-radius: 14px; box-shadow: var(--shadow);
    padding: 22px; width: 100%; max-width: 420px; max-height: 90vh; overflow: auto;
  }
  .modal h3 { font-weight: 400; letter-spacing: .04em; margin-bottom: 4px; font-size: 1.05rem; }
  .modal .m-autor { font-size: .82rem; font-style: italic; color: var(--ink-soft); margin-bottom: 16px; }
  .hist { margin-bottom: 14px; }
  .hist:empty { display: none; }
  .hist span {
    display: inline-block; font-size: .78rem; color: var(--ink-soft);
    background: var(--bg2); border-radius: 12px; padding: 4px 10px; margin: 0 6px 6px 0;
  }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--ink); color: #f3ead9; font-size: .9rem;
    padding: 11px 22px; border-radius: 24px; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 60;
    max-width: 90vw; text-align: center;
  }
  .toast.ver { opacity: 1; }
  .toast.err { background: #7d2e2e; }

  @media (max-width: 560px) {
    .wcard { flex-direction: column; align-items: center; text-align: center; }
    .wcover { flex-basis: auto; width: 150px; }
    .grid-precios { grid-template-columns: repeat(3, 1fr); }
    .grid-precios button { padding: 18px 6px; }
  }
</style>
</head>
<body>
<header>
  <h1>⚙️ Panel Admin</h1>
</header>

<main>
  <section id="login">
    <div class="caja">
      <h2>Iniciar sesión</h2>
      <input id="email" type="text" placeholder="Usuario" autocomplete="username">
      <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
      <button class="btn full" id="btnLogin">Entrar</button>
      <div class="error" id="loginErr"></div>
    </div>
  </section>

  <section id="app">
    <div class="topbar">
      <span class="tabs">
        <button id="tabWizard" class="active">💰 Poner precios</button>
        <button id="tabGestion">📚 Libros</button>
        <button id="tabConfig">⚙️ Ganancia</button>
      </span>
      <button class="logout" id="btnLogout">Salir</button>
    </div>
    <div class="topbar" style="margin-top:-8px">
      <span class="progreso" id="progreso"></span>
    </div>

    <div id="vistaWizard"></div>
    <div id="vistaGestion" style="display:none">
      <input class="buscar" id="buscar" type="search" placeholder="Buscar por título o autor…">
      <div class="lista" id="lista"></div>
    </div>

    <div id="vistaConfig" style="display:none">
      <div class="caja">
        <h2>Ganancia sobre el precio</h2>
        <p class="hint">El sitio público muestra el precio base más este porcentaje. Se aplica al instante, sin redeploy.</p>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
          <input id="cfgMargen" type="number" min="0" max="500" step="1" inputmode="decimal"
                 style="flex:0 0 110px; font:18px Georgia,serif; padding:12px 14px; border:1px solid var(--line); border-radius:10px; outline:none;">
          <span style="font-size:1.1rem">%</span>
          <button class="btn" id="btnMargen">Guardar</button>
        </div>
        <div class="preview" id="cfgPreview"></div>
      </div>
    </div>
  </section>
</main>

<div class="modal-fondo" id="modalFondo">
  <div class="modal">
    <h3 id="mTitulo"></h3>
    <div class="m-autor" id="mAutor"></div>
    <div class="hist" id="mHist"></div>
    <div class="grid-precios" id="mPrecios"></div>
    <div class="acciones">
      <input id="mCustom" type="number" min="1" step="1" placeholder="C$ otro">
      <button class="btn" id="mAsignar">Asignar</button>
      <button class="btn sec" id="mQuitar">Quitar precio</button>
      <button class="btn sec" id="mCerrar">Cancelar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient(
  'https://nsgysypegqvntlxndsaa.supabase.co',
  'sb_publishable_4znJSfRiJYpVGpALgOCWGg_q0Gz5jdx'
);

const PRECIOS = [];
for (let p = 200; p <= 1000; p += 50) PRECIOS.push(p);

const $ = id => document.getElementById(id);
let sinPrecio = [], idx = 0, todos = [], ultimo = null, libroModal = null;

function toast(msg, err) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast ver' + (err ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = 'toast', 2200);
}
const cdx = p => 'C$ ' + Number(p).toLocaleString('es-NI');
const fmtFecha = (f, conHora) => {
  if (!f) return '';
  const d = new Date(f);
  const opc = { day: '2-digit', month: '2-digit', year: 'numeric' };
  if (conHora) { opc.hour = '2-digit'; opc.minute = '2-digit'; }
  return d.toLocaleDateString('es-NI', opc);
};
const esc = s => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const portadaHTML = l => l.portada
  ? `<img src="${esc(l.portada)}" alt="" loading="lazy" onerror="this.style.display='none'">📖`
  : '📖';

/* ---------- auth ---------- */
$('btnLogin').onclick = login;
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

async function login() {
  $('btnLogin').disabled = true;
  $('loginErr').textContent = '';
  const v = $('email').value.trim();
  const { error } = await sb.auth.signInWithPassword({
    email: v.includes('@') ? v : 'admin@nicalibros.com',
    password: $('pass').value
  });
  $('btnLogin').disabled = false;
  if (error) { $('loginErr').textContent = 'Credenciales incorrectas'; return; }
  entrar();
}

$('btnLogout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

sb.auth.getSession().then(({ data }) => { if (data.session) entrar(); });

function entrar() {
  $('login').style.display = 'none';
  $('app').style.display = 'block';
  cargarWizard();
  cargarTodos();
  cargarMargen();
}

/* ---------- tabs ---------- */
const TABS = { tabWizard: 'vistaWizard', tabGestion: 'vistaGestion', tabConfig: 'vistaConfig' };
$('tabWizard').onclick = () => setTab('tabWizard');
$('tabGestion').onclick = () => setTab('tabGestion');
$('tabConfig').onclick = () => setTab('tabConfig');
function setTab(btnId) {
  for (const [b, v] of Object.entries(TABS)) {
    $(b).classList.toggle('active', b === btnId);
    $(v).style.display = b === btnId ? '' : 'none';
  }
  if (btnId === 'tabGestion') renderLista();
}

/* ---------- wizard ---------- */
async function cargarWizard() {
  const { data, error } = await sb.from('libros')
    .select('id, titulo, autor, genero, portada, precio')
    .is('precio', null)
    .order('id');
  if (error) { toast('Error cargando: ' + error.message, true); return; }
  sinPrecio = data;
  idx = 0;
  ultimo = null;
  renderWizard();
}

function renderWizard() {
  const total = sinPrecio.length;
  $('progreso').textContent = `${total} libro${total === 1 ? '' : 's'} sin precio`;
  if (idx >= total) {
    $('vistaWizard').innerHTML = `
      <div class="fin">
        <div class="grande">🎉</div>
        <p>${total === 0 ? 'Todos los libros tienen precio.' : 'Terminaste la lista.'}</p>
        <button class="btn" onclick="cargarWizard()">Volver a revisar</button>
      </div>`;
    return;
  }
  const l = sinPrecio[idx];
  $('vistaWizard').innerHTML = `
    <div class="wcard">
      <div class="wcover">${portadaHTML(l)}</div>
      <div class="wmeta">
        <div class="titulo">${esc(l.titulo)}</div>
        <div class="autor">${esc(l.autor || 'Autor desconocido')}</div>
        ${l.genero ? `<span class="genero">${esc(l.genero)}</span>` : ''}
      </div>
    </div>
    <div class="panel-precio">
      <h3>¿Precio de este libro? (${idx + 1} de ${total})</h3>
      <div class="grid-precios">
        ${PRECIOS.map(p => `<button onclick="asignar(${p})">${cdx(p)}</button>`).join('')}
      </div>
      <div class="acciones">
        <input id="custom" type="number" min="1" step="1" placeholder="C$ otro">
        <button class="btn" onclick="asignarCustom()">Asignar</button>
        <button class="btn sec" onclick="saltar()">Saltar</button>
        ${ultimo ? `<button class="btn sec" onclick="deshacer()">Deshacer ${cdx(ultimo.precio)}</button>` : ''}
      </div>
    </div>`;
  $('custom').addEventListener('keydown', e => { if (e.key === 'Enter') asignarCustom(); });
}

async function asignar(p) {
  const l = sinPrecio[idx];
  const { error } = await sb.from('libros').update({ precio: p }).eq('id', l.id);
  if (error) { toast('Error: ' + error.message, true); return; }
  ultimo = { id: l.id, precio: p };
  toast(`✓ ${cdx(p)} guardado — «${l.titulo.slice(0, 40)}${l.titulo.length > 40 ? '…' : ''}»`);
  idx++;
  renderWizard();
}

function asignarCustom() {
  const v = parseInt($('custom').value, 10);
  if (!v || v < 1) { toast('Escribe un precio válido', true); return; }
  asignar(v);
}

function saltar() { idx++; renderWizard(); }

async function deshacer() {
  if (!ultimo) return;
  await sb.from('libros').update({ precio: null }).eq('id', ultimo.id);
  idx--;
  toast('Deshecho');
  renderWizard();
}

/* ---------- gestión ---------- */
async function cargarTodos() {
  const { data, error } = await sb.from('libros')
    .select('id, titulo, autor, genero, portada, precio, precio_fecha, total_ratings')
    .order('titulo');
  if (error) { toast('Error cargando: ' + error.message, true); return; }
  todos = data;
  actualizarProgreso();
  if ($('vistaGestion').style.display !== 'none') renderLista();
}

function actualizarProgreso() {
  const con = todos.filter(l => l.precio != null).length;
  const sin = todos.length - con;
  $('progreso').textContent = `${todos.length} libros · ${con} con precio · ${sin} sin precio`;
}

$('buscar').addEventListener('input', renderLista);

function renderLista() {
  const q = $('buscar').value.trim().toLowerCase();
  const list = todos.filter(l =>
    !q || (l.titulo + ' ' + (l.autor || '')).toLowerCase().includes(q)
  );
  $('lista').innerHTML = list.length ? list.map(l => `
    <div class="fila">
      <div class="mini">${portadaHTML(l)}</div>
      <div class="info">
        <div class="t">${esc(l.titulo)}</div>
        <div class="a">${esc(l.autor || 'Autor desconocido')}${l.genero ? ' · ' + esc(l.genero) : ''}</div>
      </div>
      <span class="precio-tag">${l.precio != null ? cdx(l.precio) : '—'}${l.precio != null ? `<br><small style="font-weight:400;color:var(--ink-soft)">${MARGEN ? 'público ' + cdx(precioPublico(l)) + ' · ' : ''}${fmtFecha(l.precio_fecha)}</small>` : ''}</span>
      <div class="acciones-f">
        <button class="mini-btn" onclick="abrirModal(${l.id})">${l.precio != null ? 'Cambiar' : 'Poner precio'}</button>
      </div>
    </div>`).join('')
    : '<div class="sin">No se encontraron libros con ese criterio.</div>';
}

/* ---------- modal precio ---------- */
function abrirModal(id) {
  libroModal = todos.find(l => l.id === id);
  $('mTitulo').textContent = libroModal.titulo;
  $('mAutor').textContent = libroModal.autor || 'Autor desconocido';
  $('mCustom').value = '';
  $('mPrecios').innerHTML = PRECIOS.map(p =>
    `<button onclick="guardarModal(${p})">${cdx(p)}</button>`).join('');
  $('modalFondo').classList.add('abierto');
  cargarHistorico(id);
}

async function cargarHistorico(id) {
  $('mHist').innerHTML = '';
  const { data } = await sb.from('historico_precios')
    .select('precio, fecha')
    .eq('libro_id', id)
    .order('fecha', { ascending: false })
    .limit(10);
  if (data && data.length) {
    $('mHist').innerHTML = data.map(h =>
      `<span>${cdx(h.precio)} · ${fmtFecha(h.fecha, true)}</span>`).join('');
  }
}
$('mCerrar').onclick = () => $('modalFondo').classList.remove('abierto');
$('modalFondo').onclick = e => { if (e.target === $('modalFondo')) $('mCerrar').onclick(); };

async function guardarModal(p) {
  const { error } = await sb.from('libros').update({ precio: p }).eq('id', libroModal.id);
  if (error) { toast('Error: ' + error.message, true); return; }
  libroModal.precio = p;
  cerrarYRefrescar(`✓ ${cdx(p)} guardado`);
}
$('mAsignar').onclick = () => {
  const v = parseInt($('mCustom').value, 10);
  if (!v || v < 1) { toast('Escribe un precio válido', true); return; }
  guardarModal(v);
};
$('mQuitar').onclick = async () => {
  const { error } = await sb.from('libros').update({ precio: null }).eq('id', libroModal.id);
  if (error) { toast('Error: ' + error.message, true); return; }
  libroModal.precio = null;
  cerrarYRefrescar('Precio quitado');
};
function cerrarYRefrescar(msg) {
  $('modalFondo').classList.remove('abierto');
  toast(msg);
  cargarTodos();
  cargarWizard();
}
</script>
</body>
</html>
