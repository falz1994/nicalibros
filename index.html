<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca — Portadas</title>
<style>
  :root {
    --bg: #f5f0e8;
    --bg2: #efe7d8;
    --card: #fffdf8;
    --ink: #3d3226;
    --ink-soft: #7a6a55;
    --accent: #8c5836;
    --accent-dark: #6e4327;
    --gold: #c9a34a;
    --line: #e2d6c2;
    --shadow: 0 6px 22px rgba(61, 43, 28, .14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background:
      radial-gradient(1200px 500px at 50% -100px, #fbf7ef 0%, transparent 60%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(120deg, #241a10, #4a3420 55%, #241a10);
    color: #f3ead9;
    padding: 34px 20px 26px;
    text-align: center;
    border-bottom: 4px solid var(--gold);
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: "";
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent 0 22px, rgba(255,255,255,.03) 22px 23px);
    pointer-events: none;
  }
  h1 {
    font-size: clamp(1.6rem, 4.5vw, 2.6rem);
    letter-spacing: .06em;
    text-transform: uppercase;
    font-weight: 400;
    text-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .subtitle {
    margin-top: 6px;
    color: var(--gold);
    font-size: clamp(.85rem, 2.4vw, 1.05rem);
    font-style: italic;
    letter-spacing: .12em;
  }
  .controls {
    position: sticky; top: 0; z-index: 40;
    background: rgba(255, 253, 248, .92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px;
    display: flex; gap: 10px; flex-wrap: wrap;
    align-items: center; justify-content: center;
  }
  .controls input, .controls select {
    font: 15px Georgia, serif;
    padding: 9px 14px;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: #fff;
    color: var(--ink);
    outline: none;
    min-width: 0;
  }
  .controls input { flex: 1 1 240px; max-width: 460px; }
  .controls input:focus, .controls select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(140,88,54,.12); }
  .controls label { font-size: .82rem; color: var(--ink-soft); letter-spacing: .04em; }
  #contador {
    margin-left: auto;
    font-size: .85rem;
    color: var(--ink-soft);
    background: var(--bg2);
    padding: 6px 14px;
    border-radius: 20px;
    white-space: nowrap;
  }
  main { max-width: 1400px; margin: 0 auto; padding: 26px 16px 60px; }
  .grid {
    display: grid;
    gap: 22px;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    transition: transform .18s ease, box-shadow .18s ease;
    animation: aparecer .5s ease both;
  }
  @keyframes aparecer { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(61,43,28,.22); }
  .cover {
    position: relative;
    aspect-ratio: 2 / 3;
    background: var(--bg2) center/cover no-repeat;
  }
  .cover img {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
    transition: opacity .25s ease;
  }
  .cover img.missing {
    opacity: 0;
  }
  .fallback {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 14px; text-align: center;
    background:
      repeating-linear-gradient(45deg, #efe5d2, #efe5d2 10px, #eadfca 10px, #eadfca 20px);
    color: var(--ink-soft);
    font-style: italic;
    font-size: .82rem;
  }
  .card-body {
    padding: 12px 13px 14px;
    display: flex; flex-direction: column; gap: 6px; flex: 1;
  }
  .card-body .titulo {
    font-size: .95rem;
    line-height: 1.25;
    font-weight: 700;
    color: var(--ink);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-body .autor {
    font-size: .82rem;
    font-style: italic;
    color: var(--ink-soft);
    margin-top: auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .badges {
    display: flex; flex-wrap: wrap; gap: 5px;
  }
  .badge {
    font-size: .66rem;
    letter-spacing: .03em;
    padding: 3px 8px;
    border-radius: 10px;
    background: var(--bg2);
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .badge.best {
    background: linear-gradient(120deg, var(--gold), #e0b95c);
    color: #3a2c10;
    font-weight: 700;
  }
  .view-toggle {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 22px;
    overflow: hidden;
    background: #fff;
  }
  .view-toggle button {
    font: 14px Georgia, serif;
    padding: 9px 16px;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .view-toggle button.active {
    background: var(--accent);
    color: #fff;
  }
  #tablaWrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .table {
    width: 100%;
    min-width: 520px;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .table th {
    text-align: left;
    font-size: .78rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: var(--bg2);
    padding: 12px 16px;
    border-bottom: 2px solid var(--gold);
  }
  .table td {
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  .table tbody tr { transition: background .15s ease; }
  .table tbody tr:hover { background: #faf5ea; }
  .table tbody tr:last-child td { border-bottom: 0; }
  .table .th-cover { width: 52px; }
  .table .mini-cover {
    width: 36px; height: 54px;
    position: relative;
    border-radius: 4px;
    background: var(--bg2) center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    font-size: .7rem; color: var(--ink-soft);
    overflow: hidden;
  }
  .table .mini-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .table .mini-cover img.missing { opacity: 0; width: 0; height: 0; }
  .table .titulo-tabla { font-weight: 700; }
  .table .autor-tabla { font-style: italic; color: var(--ink-soft); }
  .table .genero-tabla { font-size: .78rem; color: var(--ink-soft); white-space: nowrap; }
  .table .td-titulo .titulo-tabla { white-space: normal; }
  .estrellas { color: var(--gold); letter-spacing: 1px; }
  .vacio {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-style: italic;
    font-size: 1.1rem;
    grid-column: 1 / -1;
  }
  footer {
    text-align: center;
    padding: 20px;
    color: var(--ink-soft);
    font-size: .8rem;
    border-top: 1px solid var(--line);
    background: var(--bg2);
  }
  @media (max-width: 640px) {
    .grid { gap: 14px; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .controls { gap: 8px; }
    .controls input { flex-basis: 100%; }
    #contador { margin-left: 0; width: 100%; text-align: center; }
    .view-toggle { width: 100%; }
    .view-toggle button { flex: 1; padding: 10px 12px; }
    .table, .table thead, .table tbody, .table tr, .table th, .table td { display: block; width: 100%; }
    .table { min-width: 0; }
    .table thead { display: none; }
    .table tbody tr {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .table tbody tr:last-child { border-bottom: 0; }
    .table .th-cover { width: auto; flex: 0 0 auto; padding: 0; border: 0; }
    .table td { padding: 0; border: 0; }
    .table .td-titulo { flex: 1 1 60%; min-width: 0; }
    .table .td-autor { flex: 1 1 100%; font-size: .82rem; }
    .table .td-genero { flex: 1 1 100%; font-size: .78rem; }
    #tablaWrap { overflow: visible; }
  }
  @media (max-width: 380px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  }
</style>
</head>

const grid = document.getElementById('grid');
const tablaWrap = document.getElementById('tablaWrap');
const busqueda = document.getElementById('busqueda');
const filtro = document.getElementById('filtro');
const contador = document.getElementById('contador');
const btnTabla = document.getElementById('btnTabla');
const btnGrid = document.getElementById('btnGrid');
let vista = 'tabla';

LIBROS.sort((a, b) => (a.ranking || 999) - (b.ranking || 999));

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function badges(l) {
  let b = '';
  if (l.ranking) b += `<span class="badge best">🏆 #${l.ranking}</span>`;
  if (l.genero) b += `<span class="badge">${escapeHtml(l.genero)}</span>`;
  if (l.bestseller) b += `<span class="badge best">⭐ Best seller</span>`;
  return b ? `<div class="badges">${b}</div>` : '';
}

function card(l) {
  const t = escapeHtml(l.titulo);
  const a = escapeHtml(l.autor || 'Autor desconocido');
  const img = l.portada
    ? `<img src="${escapeHtml(l.portada)}" alt="${t}" loading="lazy"
         onerror="this.classList.add('missing');this.nextElementSibling.style.display='flex';">
       <div class="fallback" style="display:none">📖 ${t}</div>`
    : `<div class="fallback" style="display:flex">📖 ${t}</div>`;
  return `<article class="card">
    <div class="cover">${img}</div>
    <div class="card-body">
      <div class="titulo" title="${t}">${t}</div>
      ${badges(l)}
      <div class="autor" title="${a}">${a}</div>
    </div>
  </article>`;
}

function fila(l) {
  const t = escapeHtml(l.titulo);
  const a = escapeHtml(l.autor || 'Autor desconocido');
  const g = escapeHtml(l.genero || '');
  const est = l.bestseller ? ' <span class="estrellas">⭐</span>' : '';
  const img = l.portada
    ? `<img src="${escapeHtml(l.portada)}" alt="${t}" loading="lazy"
         onerror="this.classList.add('missing');this.nextElementSibling.style.display='flex';">
       <span class="fallback" style="display:none">📖</span>`
    : `<span class="fallback" style="display:flex">📖</span>`;
  return `<tr>
    <td class="th-cover" data-label="Portada"><div class="mini-cover">${img}</div></td>
    <td class="td-titulo" data-label="Título"><div class="titulo-tabla" title="${t}">${t}${est}</div></td>
    <td class="td-genero" data-label="Género"><div class="genero-tabla">${g}</div></td>
    <td class="td-autor" data-label="Autor"><div class="autor-tabla" title="${a}">${a}</div></td>
  </tr>`;
}

function render() {
  const q = busqueda.value.trim().toLowerCase();
  const f = filtro.value;
  const list = LIBROS.filter(l => {
    if (q && !(l.titulo + ' ' + (l.autor||'')).toLowerCase().includes(q)) return false;
    if (f === 'best' && !l.bestseller) return false;
    if (f && f !== 'best' && (l.genero || '') !== f) return false;
    return true;
  });
  contador.textContent = list.length + ' libros';
  if (vista === 'tabla') {
    grid.style.display = 'none';
    tablaWrap.style.display = 'block';
    tablaWrap.innerHTML = list.length
      ? `<table class="table">
           <thead><tr><th class="th-cover">Portada</th><th>Título</th><th>Género</th><th>Autor</th></tr></thead>
           <tbody>${list.map(fila).join('')}</tbody>
         </table>`
      : '<div class="vacio">No se encontraron libros con ese criterio.</div>';
  } else {
    tablaWrap.style.display = 'none';
    grid.style.display = '';
    grid.innerHTML = list.length
      ? list.map(card).join('')
      : '<div class="vacio">No se encontraron libros con ese criterio.</div>';
  }
}

function setVista(v) {
  vista = v;
  btnTabla.classList.toggle('active', v === 'tabla');
  btnGrid.classList.toggle('active', v === 'grid');
  render();
}

btnTabla.addEventListener('click', () => setVista('tabla'));
btnGrid.addEventListener('click', () => setVista('grid'));
busqueda.addEventListener('input', render);
filtro.addEventListener('change', render);
render();
</script>
