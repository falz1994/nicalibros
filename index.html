<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca — Portadas</title>
<style>
  :root {
    --bg: #f5f0e8;
    --bg2: #efe7d8;
    --card: #fffdf8;
    --ink: #3d3226;
    --ink-soft: #7a6a55;
    --accent: #8c5836;
    --accent-dark: #6e4327;
    --gold: #c9a34a;
    --line: #e2d6c2;
    --shadow: 0 6px 22px rgba(61, 43, 28, .14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background:
      radial-gradient(1200px 500px at 50% -100px, #fbf7ef 0%, transparent 60%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(120deg, #241a10, #4a3420 55%, #241a10);
    color: #f3ead9;
    padding: 34px 20px 26px;
    text-align: center;
    border-bottom: 4px solid var(--gold);
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: "";
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent 0 22px, rgba(255,255,255,.03) 22px 23px);
    pointer-events: none;
  }
  h1 {
    font-size: clamp(1.6rem, 4.5vw, 2.6rem);
    letter-spacing: .06em;
    text-transform: uppercase;
    font-weight: 400;
    text-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .subtitle {
    margin-top: 6px;
    color: var(--gold);
    font-size: clamp(.85rem, 2.4vw, 1.05rem);
    font-style: italic;
    letter-spacing: .12em;
  }
  .controls {
    position: sticky; top: 0; z-index: 40;
    background: rgba(255, 253, 248, .92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px;
    display: flex; gap: 10px; flex-wrap: wrap;
    align-items: center; justify-content: center;
  }
  .controls input, .controls select {
    font: 15px Georgia, serif;
    padding: 9px 14px;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: #fff;
    color: var(--ink);
    outline: none;
    min-width: 0;
  }
  .controls input { flex: 1 1 240px; max-width: 460px; }
  .controls input:focus, .controls select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(140,88,54,.12); }
  .controls label { font-size: .82rem; color: var(--ink-soft); letter-spacing: .04em; }
  #contador {
    margin-left: auto;
    font-size: .85rem;
    color: var(--ink-soft);
    background: var(--bg2);
    padding: 6px 14px;
    border-radius: 20px;
    white-space: nowrap;
  }
  main { max-width: 1400px; margin: 0 auto; padding: 26px 16px 60px; }
  .grid {
    display: grid;
    gap: 22px;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    transition: transform .18s ease, box-shadow .18s ease;
    animation: aparecer .5s ease both;
  }
  @keyframes aparecer { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(61,43,28,.22); }
  .cover {
    position: relative;
    aspect-ratio: 2 / 3;
    background: var(--bg2) center/cover no-repeat;
  }
  .cover img {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
    transition: opacity .25s ease;
  }
  .cover img.missing {
    opacity: 0;
  }
  .fallback {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 14px; text-align: center;
    background:
      repeating-linear-gradient(45deg, #efe5d2, #efe5d2 10px, #eadfca 10px, #eadfca 20px);
    color: var(--ink-soft);
    font-style: italic;
    font-size: .82rem;
  }
  .card-body {
    padding: 12px 13px 14px;
    display: flex; flex-direction: column; gap: 4px; flex: 1;
  }
  .card-body .titulo {
    font-size: .95rem;
    line-height: 1.25;
    font-weight: 700;
    color: var(--ink);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-body .autor {
    font-size: .82rem;
    font-style: italic;
    color: var(--ink-soft);
    margin-top: auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .vacio {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
    font-style: italic;
    font-size: 1.1rem;
    grid-column: 1 / -1;
  }
  footer {
    text-align: center;
    padding: 20px;
    color: var(--ink-soft);
    font-size: .8rem;
    border-top: 1px solid var(--line);
    background: var(--bg2);
  }
  @media (max-width: 640px) {
    .grid { gap: 14px; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    .controls { gap: 8px; }
    .controls input { flex-basis: 100%; }
    #contador { margin-left: 0; width: 100%; text-align: center; }
  }
  @media (max-width: 380px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  }
</style>
</head>
<body>
<header>
  <h1>Biblioteca</h1>
  <div class="subtitle">Portadas de los libros encontrados</div>
</header>

<div class="controls">
  <input id="busqueda" type="search" placeholder="Buscar por título o autor…" autocomplete="off">
  <select id="filtro">
    <option value="">Todos</option>
    <option value="sin">Solo libros con portada</option>
    <option value="A–M">Títulos A–M</option>
    <option value="N–Z">Títulos N–Z</option>
  </select>
  <span id="contador"></span>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>Generado automáticamente · 199 libros · 172 con portada</footer>

const grid = document.getElementById('grid');
const busqueda = document.getElementById('busqueda');
const filtro = document.getElementById('filtro');
const contador = document.getElementById('contador');

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function card(l) {
  const t = escapeHtml(l.titulo);
  const a = escapeHtml(l.autor || 'Autor desconocido');
  const img = l.portada
    ? `<img src="${escapeHtml(l.portada)}" alt="${t}" loading="lazy"
         onerror="this.classList.add('missing');this.nextElementSibling.style.display='flex';">
       <div class="fallback" style="display:none">📖 ${t}</div>`
    : `<div class="fallback" style="display:flex">📖 ${t}</div>`;
  return `<article class="card">
    <div class="cover">${img}</div>
    <div class="card-body">
      <div class="titulo" title="${t}">${t}</div>
      <div class="autor" title="${a}">${a}</div>
    </div>
  </article>`;
}

function render() {
  const q = busqueda.value.trim().toLowerCase();
  const f = filtro.value;
  const list = LIBROS.filter(l => {
    if (q && !(l.titulo + ' ' + (l.autor||'')).toLowerCase().includes(q)) return false;
    if (f === 'sin' && !l.portada) return false;
    const letra = (l.titulo || ' ')[0].toUpperCase();
    if (f === 'A–M' && !(letra >= 'A' && letra <= 'M')) return false;
    if (f === 'N–Z' && !(letra >= 'N' && letra <= 'Z')) return false;
    return true;
  });
  contador.textContent = list.length + ' libros';
  grid.innerHTML = list.length
    ? list.map(card).join('')
    : '<div class="vacio">No se encontraron libros con ese criterio.</div>';
}

busqueda.addEventListener('input', render);
filtro.addEventListener('change', render);
render();
</script>
